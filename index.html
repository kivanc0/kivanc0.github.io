<style>
  :root { --bg: #0e0b2e; --card: #1e1650; --fg: #ffffff; --muted: #b9b0e6; --accent: #ff7bc4; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 40px 16px 64px; }

  p { color: var(--muted); }
  .game { background: var(--card); border-radius: 18px; padding: 20px 22px; margin-top: 28px; }
  .game h2 { margin: 0 0 6px; font-size: 1.3rem; color: var(--fg); }
